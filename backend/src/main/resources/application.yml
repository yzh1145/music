server:
  # 换机器时可只改环境变量，不必改代码
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: music
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:music_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  jackson:
    time-zone: Asia/Shanghai
  web:
    resources:
      # 图片、音频等静态资源位于 classpath:/static 下
      cache:
        period: 3600

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

# 自定义配置：JWT 密钥与有效期
music:
  jwt:
    secret: ${JWT_SECRET:music-cloud-2026-zcy-secret-key-please-change-in-production}
    expire-days: ${JWT_EXPIRE_DAYS:7}

logging:
  level:
    com.zcy.music: debug
  file:
    name: logs/music.log
